apiVersion: k4all.magesgate.com/v1alpha1
kind: ReleaseManifest
metadata:
  name: k4all
# Centralized source-of-truth for all K4All component versions.
# This file is baked into the bootc image at /usr/local/share/k4all-release.yaml.
# At first boot, it is copied to /etc/k4all-release.yaml if not already present.
# The migration script updates component versions from the base release to /etc/k4all-release.yaml
# while preserving user customizations in the `custom` section of each component.
spec:
  # The `os-image.imageTag` is stamped by CI during build.
  osImage:
    name: k4all-bootc
    repository: ghcr.io/gpillon/k4all-bootc
    imageTag: latest
  components:
    # --- CNI ---
    calico:
      type: manifest
      # 3.33 is tested on Kubernetes 1.35-1.37 but only upgrades from the two
      # previous minors; 3.32 upgrades from 3.15+. From 3.30 the CRDs are no
      # longer in tigera-operator.yaml and must be applied first (server-side).
      version: "v3.33.1"
      sources:
        - "https://raw.githubusercontent.com/projectcalico/calico/{{ version }}/manifests/v1_crd_projectcalico_org.yaml"
        - "https://raw.githubusercontent.com/projectcalico/calico/{{ version }}/manifests/tigera-operator.yaml"
      upgradePath:
        - version: "v3.32.4"
      namespace: tigera-operator
      inlineManifests:
        - |
          apiVersion: operator.tigera.io/v1
          kind: Installation
          metadata:
            name: default
          spec:
            # Keep it explicit: without it tigera-operator defaults to
            # /usr/libexec/kubernetes/kubelet-plugins/volume/exec/ (read-only on bootc).
            flexVolumePath: /opt/libexec/kubernetes/kubelet-plugins/volume/exec/
            calicoNetwork:
              ipPools:
              - blockSize: 22
                cidr: 10.100.0.1/18
                encapsulation: VXLANCrossSubnet
                natOutgoing: Enabled
                nodeSelector: all()
        - |
          apiVersion: operator.tigera.io/v1
          kind: APIServer
          metadata:
            name: default
          spec: {}
      custom: {}

    cilium:
      type: helm-oci
      # 1.20 is tested on Kubernetes 1.33-1.36 (1.37 needs 1.21, not released
      # yet) and needs Gateway API >= v1.6.1. One minor at a time.
      version: "1.20.4"
      upgradePath:
        - version: "1.19.10"
      repo: "quay.io/cilium/charts/cilium"
      namespace: kube-system
      # Gateway API CRDs must exist before the Cilium operator starts,
      # otherwise networking.cni.cilium.gatewayAPI is silently ignored.
      dependsOn:
        - gateway-api
      custom: {}

    cilium-cli:
      type: binary
      version: "v0.20.3"
      source: "https://github.com/cilium/cilium-cli/releases/download/{{ version }}/cilium-linux-{{ arch }}.tar.gz"
      installPath: /var/opt/k4all/bin
      dependsOn:
        - cilium
      custom: {}

    # --- Networking ---
    metallb:
      type: manifest
      # v0.15.3 fails on Kubernetes 1.36 (metallb#3034, fixed in v0.16.0).
      version: "v0.16.2"
      source: "https://raw.githubusercontent.com/metallb/metallb/{{ version }}/config/manifests/metallb-native.yaml"
      namespace: metallb-system
      dependsOn:
        - calico
        - cilium
      custom: {}

    gateway-api:
      type: manifest
      # The version Cilium 1.20 pins; must be applied before Cilium 1.20.
      version: "v1.6.3"
      source: "https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ version }}/standard-install.yaml"
      custom: {}

    nmstate:
      custom: {}
      dependsOn:
        - calico
        - cilium
      management: Managed
      namespace: nmstate
      inlineManifests:
        - |
          apiVersion: nmstate.io/v1
          kind: NMState
          metadata:
            name: nmstate
      sources:
        - https://github.com/nmstate/kubernetes-nmstate/releases/download/{{ version }}/nmstate.io_nmstates.yaml
        - https://github.com/nmstate/kubernetes-nmstate/releases/download/{{ version }}/namespace.yaml
        - https://github.com/nmstate/kubernetes-nmstate/releases/download/{{ version }}/service_account.yaml
        - https://github.com/nmstate/kubernetes-nmstate/releases/download/{{ version }}/role.yaml
        - https://github.com/nmstate/kubernetes-nmstate/releases/download/{{ version }}/role_binding.yaml
        - https://github.com/nmstate/kubernetes-nmstate/releases/download/{{ version }}/operator.yaml
      type: manifest
      version: v0.87.3

    # --- HA ---
    kube-vip:
      type: static-pod
      # The host writes kube-vip's static-pod manifest on each control plane
      # (setup-k8s-ph3.sh, k4all-upgrade). The operator's static-pod type
      # writes the image alone, without settings, and the API VIP goes away.
      # The version is the one the host writes.
      management: Unmanaged
      # Not v1.3.0: upstream asks not to install it.
      version: "v1.3.1"
      image: "ghcr.io/kube-vip/kube-vip:{{ version }}"
      namespace: kube-system
      custom: {}

    # --- Ingress ---
    # No ingress-nginx entry from v2.6.0: v2.4.0, a mandatory stop, set it
    # to management: Removed and uninstalled it on every cluster. The
    # ReleaseManifest sync keeps that entry on clusters that have it.
    traefik:
      type: helm
      # Traefik v3.7.18. k4all's own routes (Headlamp, Argo CD) use the
      # traefik class. Its Ingress-NGINX provider still serves users'
      # Ingresses of class "nginx" with their nginx.ingress.kubernetes.io
      # annotations (ssl-passthrough included), until they move to traefik.
      # The operator's Traefik hook adds the service, the host ports and the
      # default class from ClusterConfig spec.ingress.traefik (or
      # spec.ingress.nginx on clusters installed before v2.4.0, until the
      # operator moves it).
      version: "42.4.0"
      repo: "https://traefik.github.io/charts"
      chart: traefik
      namespace: traefik
      values:
        deployment:
          kind: DaemonSet
        nodeSelector:
          kubernetes.io/os: linux
          node-role.kubernetes.io/control-plane: ""
        providers:
          kubernetesIngressNGINX:
            enabled: true
          kubernetesIngress:
            enabled: true
          kubernetesCRD:
            enabled: true
        ingressClass:
          enabled: true
          name: traefik
        extraObjects:
          # For users' Ingresses only. The provider only follows Ingresses
          # whose class has the ingress-nginx controller; the chart creates
          # only the traefik class. Never the default class: the hook makes
          # traefik the default instead.
          - apiVersion: networking.k8s.io/v1
            kind: IngressClass
            metadata:
              name: nginx
              annotations:
                ingressclass.kubernetes.io/is-default-class: "false"
            spec:
              controller: k8s.io/ingress-nginx
          # What ingress-nginx's force-ssl-redirect did: routes name it with
          # traefik.ingress.kubernetes.io/router.middlewares:
          # traefik-redirect-https@kubernetescrd. On the websecure entry
          # point the request is already https and goes through.
          - apiVersion: traefik.io/v1alpha1
            kind: Middleware
            metadata:
              name: redirect-https
              namespace: traefik
            spec:
              redirectScheme:
                scheme: https
                permanent: true
      # MetalLB only: the operator's helm wait needs the LoadBalancer IP.
      # Traefik does not use cert-manager; that dependency came from
      # ingress-nginx.
      dependsOn:
        - metallb
      custom: {}

    # --- Storage ---
    topolvm:
      type: helm
      # App 0.42.x supports Kubernetes 1.34-1.36; nothing supports 1.37 yet.
      version: "17.3.1"
      repo: "https://topolvm.github.io/topolvm"
      chart: topolvm
      namespace: topolvm-system
      values:
        controller:
          replicaCount: 1
          # The chart's required pod anti-affinity (one controller per node)
          # stops a surge rollout on a single node: the new pod never
          # schedules and the old one never leaves. Replace it instead.
          updateStrategy:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1
        # topolvm-node exits when lvmd's socket is not there, and lvmd runs
        # in its own DaemonSet: on a node that joined or booted, topolvm-node
        # often started first and crash-looped ("dial unix
        # /run/topolvm/lvmd.sock: connect: no such file or directory") until
        # its back-off reached a start after lvmd's (#61). The initContainer
        # waits for the socket, so the node plugin starts once lvmd listens.
        # Its image is the pinned chart's image.reference, already on the
        # node: bump it with the chart. It mounts the chart's socket
        # directory, which exists only with lvmd in its own DaemonSet:
        # componentOverrides.topolvm that set node.lvmdEmbedded: true must
        # also set node.initContainers: [] (Helm replaces lists).
        node:
          initContainers:
            - name: wait-for-lvmd
              image: ghcr.io/topolvm/topolvm-with-sidecar:0.42.1@sha256:00acceab51f358ea88abd74bd0968f78764e9aa94146590e9bc5ead30243c45a
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  # PID 1 ignores SIGTERM without a trap: a pod deleted
                  # while it waits would last its whole grace period.
                  trap 'exit 143' TERM
                  i=0
                  until [ -S /run/topolvm/lvmd.sock ]; do
                    if [ $((i % 30)) -eq 0 ]; then
                      echo "waiting for lvmd: no /run/topolvm/lvmd.sock yet"
                    fi
                    i=$((i + 1))
                    sleep 1
                  done
                  echo "lvmd's socket is there"
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              # Root without capabilities: it only stats the root-owned
              # socket directory, mounted read-only. SELinux type spc_t:
              # lvmd's socket is container_var_run_t, and a container_t
              # process may not even stat it, so with the default type the
              # wait never ended on an enforcing node (topolvm-node and
              # lvmd are privileged, hence spc_t too).
              securityContext:
                seLinuxOptions:
                  type: spc_t
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: lvmd-socket-dir
                  mountPath: /run/topolvm
                  readOnly: true
        lvmd:
          deviceClasses:
            - name: default
              volume-group: vg_data
              default: true
              spare-gb: 5
              type: thin
              thin-pool:
                name: thin-pool
                overprovision-ratio: 4.0
        # The subchart would run a second cert-manager (~1.17) next to the
        # standalone one; TopoLVM uses the standalone cert-manager instead.
        cert-manager:
          enabled: false
        # The list replaces the chart's own, so every field the chart sets
        # in it must be here. Without volumeBindingMode the API defaults to
        # Immediate: the volume is created on some node before the pod is
        # scheduled, and the pod then cannot run anywhere else. The field is
        # immutable; operator v0.5.0 recreates an existing StorageClass.
        storageClasses:
          - name: topolvm-provisioner
            storageClass:
              fsType: xfs
              isDefaultClass: true
              volumeBindingMode: WaitForFirstConsumer
              allowVolumeExpansion: true
      dependsOn:
        - calico
        - cilium
        - cert-manager
      custom: {}

    # The volume snapshot API and its controller (external-snapshotter;
    # v8.7.0 supports Kubernetes 1.25 and later): the VolumeSnapshots of
    # KubeVirt's VM snapshots (Hangar's Snapshots tab), CDI's snapshot
    # clones, ceph-rbd's VolumeSnapshotClass. TopoLVM's controller already
    # runs the csi-snapshotter sidecar, which picks the API up when it
    # appears. Gate "snapshots": on with virt or rook (the operator of k4all
    # v2.7.0; an older one does not know the gate and installs nothing).
    # CRDs and RBAC are upstream's files at the tag. The Deployment is
    # inline: a tag's setup file runs the previous release's image (v8.7.0's
    # runs v8.6.0), so bump its image together with version. One replica (it
    # only reconciles snapshot objects, nothing waits on it), --v=2 instead
    # of upstream's chatty 5; no host path, so no SELinux exception. With
    # virt and rook both off it is removed only once no VolumeSnapshot is
    # left (they could not be deleted without it), and the CRDs stay, with
    # every VolumeSnapshotClass and VolumeSnapshotContent.
    snapshot-controller:
      type: manifest
      version: "v8.7.0"
      sources:
        - "https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{{ version }}/client/config/crd/snapshot.storage.k8s.io_volumesnapshotclasses.yaml"
        - "https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{{ version }}/client/config/crd/snapshot.storage.k8s.io_volumesnapshotcontents.yaml"
        - "https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{{ version }}/client/config/crd/snapshot.storage.k8s.io_volumesnapshots.yaml"
        - "https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{{ version }}/client/config/crd/groupsnapshot.storage.k8s.io_volumegroupsnapshotclasses.yaml"
        - "https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{{ version }}/client/config/crd/groupsnapshot.storage.k8s.io_volumegroupsnapshotcontents.yaml"
        - "https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{{ version }}/client/config/crd/groupsnapshot.storage.k8s.io_volumegroupsnapshots.yaml"
        - "https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{{ version }}/deploy/kubernetes/snapshot-controller/rbac-snapshot-controller.yaml"
      inlineManifests:
        - |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: snapshot-controller
            namespace: kube-system
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: snapshot-controller
            # As upstream: the controller is Ready once the CRDs are there
            # (it waits up to 30 s for them).
            minReadySeconds: 35
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 0
                maxUnavailable: 1
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: snapshot-controller
              spec:
                serviceAccountName: snapshot-controller
                containers:
                  - name: snapshot-controller
                    image: registry.k8s.io/sig-storage/snapshot-controller:v8.7.0
                    args:
                      - "--v=2"
                      - "--leader-election=true"
                    imagePullPolicy: IfNotPresent
      featureGate: snapshots
      dependsOn:
        - calico
        - cilium
      custom: {}

    # Rook/Ceph, optional: features.rook.enabled in the ClusterConfig
    # (featureGate rook; older operators skip gates they do not know). Rook
    # 1.21 runs Ceph 20 (Tentacle). The operator's rook-ceph hook (the
    # k4all-operator of k4all v2.7.0) creates the CephCluster rook-ceph, the
    # pool vm-pool, the StorageClass ceph-rbd (RWX Block, for live
    # migration), its VolumeSnapshotClass and CDI's StorageProfile once
    # each, with defaults from the node count (no CephCluster below 3 nodes
    # unless features.rook.smallCluster is Allow) and the ClusterConfig's
    # features.rook.storage.deviceFilter, then leaves them to Cairn: day-2
    # changes (mgr/mon count, pool settings) stay. `image` is the Ceph image
    # of that CephCluster, the one field k4all keeps (D18): a new image here
    # upgrades Ceph; Helm does not use it. The ClusterConfig's RookReady
    # condition reports the Ceph cluster. Neither chart is uninstalled while
    # a CephCluster exists: delete it first (that destroys its data).
    rook-ceph:
      type: helm
      version: "1.21.2"
      repo: "https://charts.rook.io/release"
      chart: rook-ceph
      namespace: rook-ceph
      image: "quay.io/ceph/ceph:v20.2.4"
      values:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        enableDiscoveryDaemon: false
        monitoring:
          enabled: false
        # SELinux is enforcing on k4all nodes: Ceph's pods write host paths
        # (/var/lib/rook), and without privileged Rook cannot chown them.
        hostpathRequiresPrivileged: true
      featureGate: rook
      dependsOn:
        - calico
        - cilium
        - snapshot-controller
      custom: {}

    # Rook 1.21's chart installs the ceph-csi operator but no driver: this
    # chart declares the RBD driver under the provisioner name Rook's
    # StorageClasses use (Rook's recommended values, CephFS, NFS and NVMe-oF
    # off). snapshotPolicy volumeSnapshot adds the csi-snapshotter sidecar:
    # without it a VolumeSnapshot of ceph-rbd never becomes ready (CDI picks
    # snapshots as the DataImportCron format of rbd).
    ceph-csi-drivers:
      type: helm
      version: "1.1.0"
      repo: "https://ceph.github.io/ceph-csi-operator"
      chart: ceph-csi-drivers
      namespace: rook-ceph
      values:
        operatorConfig:
          namespace: rook-ceph
          driverSpecDefaults:
            imageSet:
              name: rook-csi-operator-image-set-configmap
            nodePlugin:
              priorityClassName: system-node-critical
            controllerPlugin:
              priorityClassName: system-cluster-critical
              replicas: 1
        drivers:
          rbd:
            enabled: true
            name: rook-ceph.rbd.csi.ceph.com
            snapshotPolicy: volumeSnapshot
          cephfs:
            enabled: false
            name: rook-ceph.cephfs.csi.ceph.com
          nfs:
            enabled: false
            name: rook-ceph.nfs.csi.ceph.com
          nvmeof:
            enabled: false
            name: rook-ceph.nvmeof.csi.ceph.com
      featureGate: rook
      # The Driver CRD, the ceph-csi operator and its image set come with
      # rook-ceph; the snapshotter sidecar needs the snapshot API.
      dependsOn:
        - rook-ceph
        - snapshot-controller
      custom: {}

    # Cairn's cluster objects (roles cairn-viewer, cairn-editor,
    # cairn-admin), from the GitHub Release of the plugin Headlamp runs
    # (same tag as cairn-plugin above, with a "v"). Cairn is Rook's console:
    # this component and Cairn's plugin come with features.rook.enabled.
    # dependsOn: turning Rook off uninstalls the console first.
    cairn:
      type: manifest
      version: "v0.1.1"
      source: "https://github.com/kalik1/cairn/releases/download/{{ version }}/cairn-cluster.yaml"
      featureGate: rook
      dependsOn:
        - rook-ceph
      custom: {}

    # --- Certificates ---
    cert-manager:
      type: helm
      # 1.21 is tested on Kubernetes 1.33-1.36; no release supports 1.37 yet.
      # Upstream: one minor at a time, latest patch of each. installCRDs is
      # deprecated from 1.15 (crds.enabled); never set both.
      version: "v1.21.3"
      repo: "https://charts.jetstack.io"
      chart: cert-manager
      namespace: cert-manager
      helmArgs:
        - "--set crds.enabled=true"
      upgradePath:
        - version: "v1.15.5"
        - version: "v1.16.5"
        - version: "v1.17.4"
        - version: "v1.18.6"
        - version: "v1.19.6"   # never v1.19.0
        - version: "v1.20.5"
      dependsOn:
        - calico
        - cilium
      custom: {}

    # --- Dashboard ---
    headlamp:
      type: helm
      version: "0.46.0"
      repo: "https://kubernetes-sigs.github.io/headlamp/"
      chart: headlamp
      namespace: headlamp
      values:
        config:
          oidc:
            clientID: ""
            clientSecret: ""
            issuerURL: ""
            scopes: ""
          pluginsDir: /headlamp/plugins
        service:
          type: NodePort
          port: 4466
          nodePort: 32323
        # The dashboard route is the Ingress of the operator's headlamp hook
        # (class traefik and the redirect Middleware, k4all-operator v0.4.2
        # and later), plus the FQDN rule of update-routes.sh: the chart's own
        # Ingress stays off. Turned on through componentOverrides, it uses
        # Traefik too.
        ingress:
          enabled: false
          ingressClassName: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect-https@kubernetescrd
        # The Headlamp plugins, pinned like every component: the k4all
        # addon (headlamp-plugin/ in this repo), Hangar, the console of
        # KubeVirt (github.com/kalik1/hangar), and Cairn, the console of
        # Rook/Ceph (github.com/kalik1/cairn). For each, an initContainer
        # copies the plugin from its image into an emptyDir mounted
        # read-only at <pluginsDir>/<name>-headlamp-plugin, so pluginsDir
        # stays usable for other plugins. A new plugin tag changes the pod
        # template: the operator re-applies headlamp and the new pod starts
        # with the new plugin. The operator's headlamp hook finds the
        # entries by name: it leaves out hangar-plugin without
        # features.virt and cairn-plugin without Rook, and merges the
        # entries of componentOverrides.headlamp with these by name
        # (volumeMounts by mountPath) instead of Helm's list replace. An
        # override entry with one of these names replaces it, unless it
        # runs another tag of the same image (a copy made for an older
        # release): k4all's pin stays. The hangar, hangar-node-agent and
        # cairn components below are the same releases' cluster objects:
        # bump their version with these tags.
        initContainers:
          - name: k4all-plugin
            image: ghcr.io/gpillon/k4all-headlamp-plugin:0.2.0
            imagePullPolicy: IfNotPresent
            command:
              - sh
              - -c
              - cp -R /plugins/k4all-headlamp-plugin/. /k4all-plugin/
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 32Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 100
              runAsGroup: 101
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
              - name: k4all-plugin
                mountPath: /k4all-plugin
          - name: hangar-plugin
            image: ghcr.io/kalik1/hangar-headlamp-plugin:0.1.1
            imagePullPolicy: IfNotPresent
            command:
              - sh
              - -c
              - cp -R /plugins/hangar-headlamp-plugin/. /hangar-plugin/
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 32Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 100
              runAsGroup: 101
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
              - name: hangar-plugin
                mountPath: /hangar-plugin
          - name: cairn-plugin
            image: ghcr.io/kalik1/cairn-headlamp-plugin:0.1.1
            imagePullPolicy: IfNotPresent
            command:
              - sh
              - -c
              - cp -R /plugins/cairn-headlamp-plugin/. /cairn-plugin/
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 32Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 100
              runAsGroup: 101
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
              - name: cairn-plugin
                mountPath: /cairn-plugin
        volumes:
          - name: k4all-plugin
            emptyDir:
              sizeLimit: 16Mi
          - name: hangar-plugin
            emptyDir:
              sizeLimit: 16Mi
          - name: cairn-plugin
            emptyDir:
              sizeLimit: 16Mi
        volumeMounts:
          - name: k4all-plugin
            mountPath: /headlamp/plugins/k4all-headlamp-plugin
            readOnly: true
          - name: hangar-plugin
            mountPath: /headlamp/plugins/hangar-headlamp-plugin
            readOnly: true
          - name: cairn-plugin
            mountPath: /headlamp/plugins/cairn-headlamp-plugin
            readOnly: true
      # traefik: its Middleware traefik/redirect-https exists by the time
      # the headlamp hook writes the dashboard route.
      dependsOn:
        - cert-manager
        - traefik
      custom: {}

    # --- Monitoring ---
    metrics-server:
      type: manifest
      # Pinned: without a versionUrl "latest" is never resolved, so each install
      # would get whatever release is current and the args patch could break.
      version: "v0.9.1"
      source: "https://github.com/kubernetes-sigs/metrics-server/releases/download/{{ version }}/components.yaml"
      namespace: kube-system
      dependsOn:
        - calico
        - cilium
      patches:
        - target:
            apiVersion: apps/v1
            kind: Deployment
            name: metrics-server
            namespace: kube-system
          type: strategic
          patch: '{"spec":{"template":{"spec":{"containers":[{"name":"metrics-server","args":["--cert-dir=/tmp","--secure-port=10250","--kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname","--kubelet-use-node-status-port","--metric-resolution=15s","--kubelet-insecure-tls"]}]}}}}'
      custom: {}

    # --- Virtualization ---
    kubevirt:
      type: manifest
      # 1.9 supports Kubernetes 1.34-1.36; 1.37 needs 1.10. One minor at a
      # time, latest patch to latest patch. Was "latest": pinned so stable.txt
      # cannot jump a minor on its own.
      version: "v1.9.1"
      upgradePath:
        - version: "v1.6.6"
        - version: "v1.7.4"
        - version: "v1.8.4"
      sources:
        - "https://github.com/kubevirt/kubevirt/releases/download/{{ version }}/kubevirt-operator.yaml"
        - "https://github.com/kubevirt/kubevirt/releases/download/{{ version }}/kubevirt-cr.yaml"
      namespace: kubevirt
      featureGate: virt
      # The snapshot API first: VM snapshots and CDI's snapshot clones.
      dependsOn:
        - snapshot-controller
      # KubeVirt runs its operator and its infra (virt-api, virt-controller,
      # virt-exportproxy) only on control planes, with PodDisruptionBudgets
      # of minAvailable 1. With one control plane its drain can never end:
      # nothing can move. Prefer control planes instead of requiring them.
      patches:
        - target:
            apiVersion: apps/v1
            kind: Deployment
            name: virt-operator
            namespace: kubevirt
          type: strategic
          patch: '{"spec":{"template":{"spec":{"affinity":{"nodeAffinity":{"requiredDuringSchedulingIgnoredDuringExecution":null,"preferredDuringSchedulingIgnoredDuringExecution":[{"weight":100,"preference":{"matchExpressions":[{"key":"node-role.kubernetes.io/control-plane","operator":"Exists"}]}}]}}}}}}'
        - target:
            apiVersion: kubevirt.io/v1
            kind: KubeVirt
            name: kubevirt
            namespace: kubevirt
          type: merge
          patch: '{"spec":{"infra":{"nodePlacement":{"affinity":{"nodeAffinity":{"preferredDuringSchedulingIgnoredDuringExecution":[{"weight":100,"preference":{"matchExpressions":[{"key":"node-role.kubernetes.io/control-plane","operator":"Exists"}]}}]}}}}}}'
        # A release invariant (D3): after a KubeVirt update, running VMs move
        # to the new virt-launcher by live migration; a VM that cannot
        # migrate keeps running on the old one until it restarts (no Evict).
        # Without it KubeVirt updates no workload. Upstream's CR has
        # workloadUpdateStrategy: {}, and this patch comes after its apply,
        # so every apply ends with [LiveMigrate] (an operator test checks it
        # with v0.5.7's apply). Hangar owns the rest of KubeVirt's VM policy
        # (evictionStrategy, vmRolloutStrategy, cpuModel).
        - target:
            apiVersion: kubevirt.io/v1
            kind: KubeVirt
            name: kubevirt
            namespace: kubevirt
          type: merge
          patch: '{"spec":{"workloadUpdateStrategy":{"workloadUpdateMethods":["LiveMigrate"]}}}'
      custom: {}

    virtctl:
      type: binary
      version: "v1.9.1"   # same tag as kubevirt
      source: "https://github.com/kubevirt/kubevirt/releases/download/{{ version }}/virtctl-{{ version }}-linux-{{ arch }}"
      installPath: /var/opt/k4all/bin
      featureGate: virt
      dependsOn:
        - kubevirt
      custom: {}

    cdi:
      type: manifest
      version: "v1.66.1"
      upgradePath:
        - version: "v1.65.0"
      sources:
        - "https://github.com/kubevirt/containerized-data-importer/releases/download/{{ version }}/cdi-operator.yaml"
        - "https://github.com/kubevirt/containerized-data-importer/releases/download/{{ version }}/cdi-cr.yaml"
      namespace: cdi
      featureGate: virt
      dependsOn:
        - kubevirt
      patches:
        - target:
            apiVersion: cdi.kubevirt.io/v1beta1
            kind: CDI
            name: cdi
          type: merge
          patch: '{"spec":{"config":{"podResourceRequirements":{"limits":{"memory":"2G"}}}}}'
      custom: {}

    # Hangar's cluster objects, from the GitHub Release of the plugin
    # Headlamp runs (same tag as hangar-plugin above, with a "v"): the
    # roles hangar-viewer, -vm-operator, -vm-admin and -hardware-admin
    # (for users other than cluster-admin) and the delete protection
    # (ValidatingAdmissionPolicy hangar-protect-from-deletion: a VM, disk
    # or DataVolume labelled hangar.magesgate.com/protected cannot be
    # deleted). Hangar itself runs in Headlamp: nothing else to run.
    hangar:
      type: manifest
      version: "v0.1.1"
      source: "https://github.com/kalik1/hangar/releases/download/{{ version }}/hangar-cluster.yaml"
      featureGate: virt
      dependsOn:
        - kubevirt
        - cdi
        - snapshot-controller
      custom: {}

    # Hangar's node agent (namespace hangar-system): one pod per node that
    # publishes the node's PCI, USB and disk inventory (Hangar's Hardware
    # tab) and binds to vfio-pci the PCI devices given to VMs from Hangar,
    # with a udev rule so they stay bound after a reboot. Its agent
    # container is privileged (spc_t under SELinux: it writes /sys and
    # /etc/udev/rules.d) and sees the node's processes (hostPID), without
    # any API access: its only input is the ConfigMap hangar-passthrough.
    # Installed with virt unless the ClusterConfig sets
    # features.virt.hangar.nodeAgent: false (D6; absent means installed),
    # which uninstalls it from a cluster that runs it: the operator of k4all
    # v2.7.0 checks that field by this component's name, on top of the virt
    # gate (an older operator installs it with virt). management Unmanaged
    # keeps the operator away from it. Its removal leaves the VMs and the
    # devices already bound as they are.
    hangar-node-agent:
      type: manifest
      version: "v0.1.1"   # same tag as hangar
      source: "https://github.com/kalik1/hangar/releases/download/{{ version }}/hangar-node-agent.yaml"
      featureGate: virt
      dependsOn:
        - kubevirt
      custom: {}

    # The metadata service of VMs on 169.254.169.254: OpenStack and EC2
    # paths (cloud-init, cloudbase-init, cirros), IMDSv2, and the VM's
    # ServiceAccount tokens for the audiences of the ClusterConfig. Part of
    # the k4all-operator: no sources, its hook applies two
    # MutatingAdmissionPolicies that add to each served VM's virt-launcher
    # pod an init container redirecting 169.254.169.254:80 (NET_ADMIN
    # only, container_t) and the server (uid 107, read-only, no
    # capabilities); its metadata controller writes each VM's Secret
    # k4all-md-<vm> from the VM's spec. On with
    # spec.features.virt.metadata.enabled (gate virtMetadata: an operator
    # before v0.6.0 does not know it and leaves this component out).
    # The image is released with the operator, same tag: version is
    # k4all-operator's version.
    k4all-metadata:
      type: manifest
      version: "v0.6.0"   # same tag as k4all-operator
      image: "ghcr.io/gpillon/k4all-metadata:{{ version }}"
      featureGate: virtMetadata
      dependsOn:
        - kubevirt
      custom: {}

    # Hangar replaces kubevirt-manager. On clusters that ran it, the
    # operator's kubevirt-manager hook removes its console and roles; it
    # keeps a PriorityClass (vm-standard, vm-preemptible) while a VM or
    # pod names it (kubevirt-manager wrote it into the VMs it made, which
    # could neither start nor move without it), its image catalog CRD
    # while it holds images, and its namespace while the user's objects
    # are in it. No sources: an operator that deletes what a removed
    # component's manifests list (before the hook) deletes nothing.
    # The VMs are untouched.
    kubevirt-manager:
      type: manifest
      management: Removed
      version: "v1.5.4"
      featureGate: virt
      custom: {}

    # --- GitOps ---
    argocd:
      type: helm
      # Argo CD v3.6.1, tested on Kubernetes 1.34-1.37. Was "" (latest chart at install).
      version: "10.18.0"
      repo: "https://argoproj.github.io/argo-helm"
      chart: argo-cd
      namespace: argocd
      values:
        global:
          domain: argocd.example.com
        configs:
          params:
            server.insecure: true
        # server.insecure: the backend is plain HTTP on the service's http
        # port, Traefik's default scheme (no serversscheme needed). The
        # Middleware replaces ingress-nginx's force-ssl-redirect.
        server:
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect-https@kubernetescrd
      featureGate: argocd
      dependsOn:
        - calico
        - cilium
        - traefik
      custom: {}

    # --- OVS/Multus ---
    multus-cni:
      type: manifest
      version: "v4.3.2"
      source: "https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/{{ version }}/deployments/multus-daemonset.yml"
      featureGate: ovsCni
      dependsOn:
        - calico
        - cilium
      # The tagged manifest still uses the floating :snapshot image. Patches are
      # not templated: bump the image tag together with version.
      patches:
        - target:
            apiVersion: apps/v1
            kind: DaemonSet
            name: kube-multus-ds
            namespace: kube-system
          type: strategic
          patch: '{"spec":{"template":{"spec":{"initContainers":[{"name":"install-multus-binary","image":"ghcr.io/k8snetworkplumbingwg/multus-cni:v4.3.2"}],"containers":[{"name":"kube-multus","image":"ghcr.io/k8snetworkplumbingwg/multus-cni:v4.3.2"}]}}}}'
      custom: {}

    ovs-cni:
      type: manifest
      version: "v0.40.0"
      source: "https://raw.githubusercontent.com/k8snetworkplumbingwg/ovs-cni/{{ version }}/examples/ovs-cni.yml"
      featureGate: ovsCni
      dependsOn:
        - multus-cni
      # The tagged manifest still uses the floating :latest image. Patches are
      # not templated: bump the image tag together with version.
      patches:
        - target:
            apiVersion: apps/v1
            kind: DaemonSet
            name: ovs-cni-amd64
            namespace: kube-system
          type: strategic
          patch: '{"spec":{"template":{"spec":{"initContainers":[{"name":"ovs-cni-plugin","image":"ghcr.io/k8snetworkplumbingwg/ovs-cni-plugin:v0.40.0"}],"containers":[{"name":"ovs-cni-marker","image":"ghcr.io/k8snetworkplumbingwg/ovs-cni-plugin:v0.40.0"}]}}}}'
      custom: {}

    # --- Operator (bootstrapped by deploy-operator.sh, tracked here for version/source) ---
    k4all-operator:
      type: manifest
      management: Managed
      # A release tag, never "latest" (the image build refuses it).
      # v0.5.0: the topolvm hook recreates a StorageClass whose immutable
      # fields (volumeBindingMode) changed, which WaitForFirstConsumer above
      # needs on existing clusters.
      # v0.5.1 (k4all v2.6.1): the cleanup of the ingress-nginx namespace
      # after its uninstall.
      # v0.5.2: a component switched from Unmanaged to Managed follows its
      # upgradePath from the version it runs, and manifest steps wait until
      # the step runs (#55).
      # v0.5.3 (k4all v2.6.4): Cilium names ovs-bridge in its devices (1.20
      # skips the OVS bridge and its agents stopped at every boot), keeps the
      # socket load balancer in the host namespace with KubeVirt, and leaves
      # Multus' CNI config alone.
      # v0.5.4 (k4all v2.6.5): KubeVirt's emulation "auto" follows the nodes
      # (KVM on a node -> useEmulation false), not the operator pod, which
      # never sees /dev/kvm; Unmanaged and Skipped components keep their
      # transition time.
      # v0.5.7 (k4all v2.6.6; includes v0.5.5 and v0.5.6): an apply of
      # KubeVirt or CDI keeps the feature gates set on the cluster; a
      # recreated topolvm-provisioner StorageClass keeps its CDI
      # StorageProfile spec (#80); a fresh KubeVirt/CDI waits for its
      # operator instead of showing Failed (#81); turning virt off is refused
      # while VMs or their disks exist, and otherwise lets KubeVirt and CDI
      # uninstall themselves before their operators go (#94); a Helm release
      # left pending by a stopped operator is recovered; a ClusterUpgrade
      # labels the node it drains and does not cordon a node a
      # PodDisruptionBudget would keep from draining (#86, #87).
      # v0.5.8 (k4all v2.6.7): a ClusterUpgrade does not cordon a node that
      # runs a pod without a controller, names it, and never evicts one
      # (#99).
      # v0.6.0 (k4all v2.7.0): the ClusterConfig API of v2.7.0 (node
      # settings, KubeVirt settings, features.rook, the metadata service),
      # the Hangar, Rook, snapshot-controller and k4all-metadata components
      # with their gates, uninstall guards that keep a component while its
      # data lives, the Cilium pool from podNetwork on new installs and the
      # PodNetworkOverlap check, and the upgrade-graph guards of #74 and #77
      # (MigrationsAhead, DowngradeRefused).
      version: "v0.6.0"
      versionUrl: "https://api.github.com/repos/gpillon/k4all-operator/releases"
      source: "https://github.com/gpillon/k4all-operator/releases/download/{{ version }}/install.yaml"
      namespace: k4all-operator-system
      custom: {}
