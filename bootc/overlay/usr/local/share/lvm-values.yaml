controller:
  replicaCount: 1

lvmd:
  deviceClasses:
    - name: default
      volume-group: vg_data
      default: true
      spare-gb: 5
      type: thin
      thin-pool:
        name: thin-pool
        overprovision-ratio: 4.0


cert-manager:
  enabled: true

storageClasses:
  - name: topolvm-provisioner
    storageClass: 
      fsType: xfs
      isDefaultClass: true
      allowVolumeExpansion: true