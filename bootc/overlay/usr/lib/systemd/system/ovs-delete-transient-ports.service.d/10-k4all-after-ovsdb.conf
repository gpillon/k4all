# Fedora 45's Open vSwitch 4.0 orders this unit after ovsdb-server.socket
# only. On a boot that creates /etc/openvswitch/conf.db (the first boot, or
# after the database was removed) its `ovs-vsctl find port` connects before
# `ovs-ctl start` has initialized the database and waits forever: the unit
# has no timeout, so the boot never finishes. Seen on the first boot after a
# restore (#50), when the restored OVS profiles start Open vSwitch at once.
# After ovsdb-server.service the database is ready, as with Open vSwitch 3.x.
[Unit]
After=ovsdb-server.service

[Service]
TimeoutStartSec=120
