# Fedora's fstrim.service trims what --listed-in /etc/fstab:/proc/self/mountinfo
# names, and --listed-in takes only the first list that has entries. On bootc
# that is /etc/fstab, where / is read-only, so fstrim skips it, and TopoLVM's
# volumes are never in it: only /boot and /boot/efi were trimmed, and the thin
# pools filled up while df showed the filesystems mostly free (#49, #131).
# Trim every mounted filesystem that supports it instead. A drop-in of the
# same name in /etc/systemd/system/fstrim.service.d/ overrides this one.
[Service]
ExecStart=
ExecStart=/usr/bin/fstrim --all --verbose --quiet-unsupported
