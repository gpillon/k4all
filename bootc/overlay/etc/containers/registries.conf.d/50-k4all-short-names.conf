# K4All: image names without a registry (e.g. "nginx:latest") resolve on
# docker.io only, as with Docker and containerd.
#
# Fedora lists three unqualified-search registries and sets
# short-name-mode = "enforcing", so CRI-O 1.35 rejects such names as ambiguous
# ("short name mode is enforcing, but image name ... returns ambiguous list").
# CRI-O 1.32 accepted them, so pods with short image names stopped starting
# after the move to CRI-O 1.35. With one search registry the names are no
# longer ambiguous and enforcing mode stays on.
unqualified-search-registries = ["docker.io"]
