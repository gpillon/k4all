# k4all upgrade graph (source).
#
# One entry per release, oldest first. The CI turns this file into
# upgrade-graph.json (with the digest of every release's multi-arch index, as
# indexDigest: never as digest, see build-graph.py) and publishes it with each
# GitHub release; a copy without digests is baked into the image at
# /usr/local/share/k4all-upgrade/releases.json.
# `k4all-upgrade` reads it to plan hops; the rules are enforced by
# bootc/tests/upgrade/test_graph.py.
#
# Versioning rules (see docs/upgrades.md):
#   minor: changes the Kubernetes minor, the Fedora major or the CRI-O minor,
#          replaces a platform component, or carries a migration that
#          `bootc rollback` cannot undo. Minor releases are X.Y.0 and are
#          mandatory stops.
#   patch: everything else, inside one X.Y stream. A patch has
#          minFrom >= X.Y.0, so it never crosses a minor. A patch may sync
#          its ReleaseManifest (a component patch, a new operator); a later
#          patch whose minFrom lets it skip that one syncs too.
#
# Streams (docs/adr/0010-releases-come-from-main-in-version-order.md):
#   releases are cut from main in version order. Once X.(Y+1).0 ships, the
#   X.Y stream gets only an exit patch: the fix of the hop out of it, the
#   release manifest of the patch before it, syncManifest false, tagged
#   before this file lists it. A component's pinned version never goes
#   down on any path to a release that syncs (test_graph.py reads every
#   release's manifest from its tag).
#
# Fields:
#   version       release tag
#   kind          minor | patch
#   minFrom       oldest release that may switch straight to this one
#   kubernetes    exact kubelet/kubeadm version in the image
#   crio          CRI-O minor in the image
#   fedora        Fedora major of the base image
#   syncManifest  apply this image's ReleaseManifest to the cluster after
#                 the hop (bootstrap node)
#   blocked       true withdraws a release: k4all-upgrade never picks it
releases:
  - version: v2.2.4
    kind: patch
    # Reached from v2.0.0-beta1 .. v2.2.3 with k4all-bridge.sh, not with
    # k4all-upgrade (older images do not have it).
    minFrom: v2.0.0-beta1
    kubernetes: "1.35.6"
    crio: "1.32"
    fedora: 43
    syncManifest: false
    notes: >-
      Bridge release: adds k4all-upgrade, masks the bootc auto-update timer
      and fixes the scripts that later hops rely on. Kubernetes, CRI-O and
      Fedora lines are unchanged. On the bootstrap node the bridge sets
      kube-vip to management Unmanaged in the ReleaseManifest: operators up
      to v0.4.x rewrite its static-pod manifest without settings, which takes
      the API VIP down. HA clusters not bridged yet: see docs/upgrades.md
      (kube-vip on HA clusters).

  - version: v2.3.0
    kind: minor
    minFrom: v2.2.4
    kubernetes: "1.35.10"
    crio: "1.35"
    fedora: 43
    syncManifest: false
    notes: >-
      CRI-O moves from 1.32 to 1.35, matching Kubernetes 1.35 (from Fedora's
      versioned cri-o1.35 package); from here CRI-O follows the Kubernetes
      minor. The control plane goes to the latest 1.35 patch. Image names
      without a registry resolve on docker.io only: CRI-O 1.35 rejects them
      as ambiguous with Fedora's three search registries.

  - version: v2.4.0
    kind: minor
    minFrom: v2.3.0
    kubernetes: "1.35.10"
    crio: "1.35"
    fedora: 43
    syncManifest: true
    notes: >-
      First ReleaseManifest sync: operator v0.5.0 (upgrade pause gate,
      upgradePath, ClusterUpgrade) and the k4all Headlamp plugin, from which
      every later upgrade can run; then every component pinned to a release
      tested on Kubernetes 1.35-1.37, walking intermediate versions where
      upstream needs them (Calico, Cilium, cert-manager, KubeVirt, CDI).
      Cilium options become typed ClusterConfig fields. kube-vip is the
      host's (Unmanaged, pinned v1.3.1: k4all-upgrade writes it on every
      control plane of an HA cluster), and TopoLVM volumes wait for their
      first consumer. Traefik replaces ingress-nginx, whose last release is
      tested only up to Kubernetes 1.35: the operator uninstalls
      ingress-nginx, then installs Traefik on the same IP or host ports.
      k4all's own routes (Headlamp, Argo CD) move to the traefik class and
      spec.ingress.nginx moves to spec.ingress.traefik; Ingresses of class
      nginx keep working through Traefik's Ingress-NGINX provider until they
      move. Routes are down until Traefik runs, after the first upgrade step
      of the CNI and of cert-manager and the components ordered before it
      (minutes). A minor because CRD upgrades cannot be undone with bootc
      rollback, and because it replaces a platform component.

  - version: v2.5.0
    kind: minor
    minFrom: v2.4.0
    kubernetes: "1.35.10"
    crio: "1.35"
    fedora: 45
    syncManifest: false
    notes: >-
      Base image moves from Fedora 43 to Fedora 45 (Fedora 43 reaches end of
      life on 2026-12-02). Kubernetes and CRI-O are unchanged. The host etcd
      package is gone: backups run etcdctl from the etcd image.

  - version: v2.6.0
    kind: minor
    minFrom: v2.5.0
    kubernetes: "1.36.6"
    crio: "1.36"
    fedora: 45
    syncManifest: false
    notes: >-
      Kubernetes 1.35 to 1.36 (kubeadm upgrade before the reboot) and CRI-O
      1.36. Before kubeadm 1.36, k4all-upgrade removes the flex-volume flag
      from the kubeadm-config ConfigMap and from /etc/k8s-config.yaml on every
      node (kubeadm 1.36 no longer mounts the flex-volume directory into the
      controller manager). The components of v2.4.0, Traefik included,
      already support 1.36. ingress-nginx, which v2.4.0 removed from every
      cluster, leaves the release manifest.

  - version: v2.6.1
    kind: patch
    minFrom: v2.6.0
    kubernetes: "1.36.6"
    crio: "1.36"
    fedora: 45
    syncManifest: true
    notes: >-
      k4all-operator v0.5.1 (from v0.5.0), through a ReleaseManifest sync
      (no other component changes): it fixes the cleanup of the ingress-nginx
      namespace. k4all-upgrade matches an image staged by its index digest,
      which the graph now lists as indexDigest; the tools of v2.2.4 - v2.6.0
      ignore that key and keep using the tags. Kubernetes, CRI-O and Fedora
      are unchanged. A patch: in mode auto it runs in the maintenance window.

  - version: v2.6.2
    kind: patch
    minFrom: v2.6.0
    kubernetes: "1.36.6"
    crio: "1.36"
    fedora: 45
    syncManifest: true
    notes: >-
      A 1.x node moves to 2.x with k4all-backup.sh and the installer's
      Restore: the installer finds backups on LVM volumes, the restore brings
      back etcd without network, the hostname, the node IP, the network
      connections that were active, the node's own /etc changes (mount units,
      drop-ins, dispatcher scripts, sysctl), renames a hand-made thin pool to
      thin-pool, and leaves the restored cluster's components Unmanaged. On
      every node, ovs-delete-transient-ports waits for ovsdb-server (Fedora
      45's Open vSwitch could hang the first boot). Same components as
      v2.6.1, k4all-operator v0.5.1; the manifest sync is there for nodes
      that come from v2.6.0. Kubernetes, CRI-O and Fedora are unchanged.

  - version: v2.6.3
    kind: patch
    minFrom: v2.6.0
    kubernetes: "1.36.6"
    crio: "1.36"
    fedora: 45
    syncManifest: true
    notes: >-
      The installer's K4All layout fits disks whose optimal I/O size is larger
      than the BIOS boot partition (RAID controllers such as the HP Smart
      Array P420): when the disk label stays for a kept volume group and the
      node boots with BIOS, the layout reuses the existing BIOS boot
      partition, so a 1.x node can be reinstalled on such a controller. The
      storage spoke says "Layout APPLIED" only when the partitioning
      succeeded, and shows the error otherwise. Only the installer changes:
      same components as v2.6.2, k4all-operator v0.5.1; the manifest sync is
      there for nodes that come from v2.6.0. Kubernetes, CRI-O and Fedora are
      unchanged.

  - version: v2.6.4
    kind: patch
    minFrom: v2.6.0
    kubernetes: "1.36.6"
    crio: "1.36"
    fedora: 45
    syncManifest: true
    notes: >-
      Every node pins the kubelet's --node-ip to its own address before the
      kubelet starts (k4all-node-ip.service at every boot, kubeadm init and
      join): a node no longer registers the pod-network address of
      cilium_host, or CRI-O's bridge, as its InternalIP once k4all moves its
      IP to ovs-bridge. k4all-operator v0.5.3 (from v0.5.1, through the
      manifest sync): with the OVS bridge, Cilium names ovs-bridge in its
      devices and keeps detecting the others, so its agents start again on
      every boot (Cilium 1.20 skips the OVS bridge and stopped with "unable
      to determine direct routing device"); with KubeVirt, Cilium keeps the
      socket load balancer in the host namespace, so VMs on the pod network
      reach ClusterIPs and the cluster DNS; with Multus, Cilium leaves
      Multus' CNI config alone, so secondary networks attach. The operator
      restarts no agent: during the hop the bootstrap names ovs-bridge
      before Cilium has to start after the reboot and restarts its own agent
      and Multus after the sync; the other nodes read the new configuration
      at their reboot. It also brings v0.5.2: a component switched from
      Unmanaged to Managed (a cluster restored from 1.x) follows its
      upgradePath from the version it runs. KubeVirt's operator and infra
      prefer control planes instead of requiring them, so the drain of a
      cluster's only control plane can end (its PodDisruptionBudgets left
      nothing to move). firewalld opens Cilium's VXLAN port. Same components
      otherwise. Kubernetes, CRI-O and Fedora are unchanged.
