# k4all upgrade graph (source).
#
# One entry per release, oldest first. The CI turns this file into
# upgrade-graph.json (with the multi-arch digest of every release) and
# publishes it with each GitHub release; a copy without digests is baked into
# the image at /usr/local/share/k4all-upgrade/releases.json.
# `k4all-upgrade` reads it to plan hops; the rules are enforced by
# bootc/tests/upgrade/test_graph.py.
#
# Versioning rules (see docs/upgrades.md):
#   minor: changes the Kubernetes minor, the Fedora major or the CRI-O minor,
#          replaces a platform component, or carries a migration that
#          `bootc rollback` cannot undo. Minor releases are X.Y.0 and are
#          mandatory stops.
#   patch: everything else, inside one X.Y stream. A patch has
#          minFrom >= X.Y.0, so it never crosses a minor.
#
# Fields:
#   version       release tag
#   kind          minor | patch
#   minFrom       oldest release that may switch straight to this one
#   kubernetes    exact kubelet/kubeadm version in the image
#   crio          CRI-O minor in the image
#   fedora        Fedora major of the base image
#   syncManifest  apply this image's ReleaseManifest to the cluster after
#                 the hop (bootstrap node)
#   blocked       true withdraws a release: k4all-upgrade never picks it
releases:
  - version: v2.2.4
    kind: patch
    # Reached from v2.0.0-beta1 .. v2.2.3 with k4all-bridge.sh, not with
    # k4all-upgrade (older images do not have it).
    minFrom: v2.0.0-beta1
    kubernetes: "1.35.6"
    crio: "1.32"
    fedora: 43
    syncManifest: false
    notes: >-
      Bridge release: adds k4all-upgrade, masks the bootc auto-update timer
      and fixes the scripts that later hops rely on. Kubernetes, CRI-O and
      Fedora lines are unchanged.

  - version: v2.3.0
    kind: minor
    minFrom: v2.2.4
    kubernetes: "1.35.10"
    crio: "1.35"
    fedora: 43
    syncManifest: false
    notes: >-
      CRI-O moves from 1.32 to 1.35, matching Kubernetes 1.35 (from Fedora's
      versioned cri-o1.35 package); from here CRI-O follows the Kubernetes
      minor. The control plane goes to the latest 1.35 patch. Image names
      without a registry resolve on docker.io only: CRI-O 1.35 rejects them
      as ambiguous with Fedora's three search registries.

  - version: v2.4.0
    kind: minor
    minFrom: v2.3.0
    kubernetes: "1.35.10"
    crio: "1.35"
    fedora: 43
    syncManifest: true
    notes: >-
      First ReleaseManifest sync: operator v0.4.1 (upgrade pause gate,
      upgradePath, ClusterUpgrade) and the k4all Headlamp plugin, from which
      every later upgrade can run; then every component pinned to a release
      tested on Kubernetes 1.35-1.37, walking intermediate versions where upstream needs
      them (Calico, Cilium, cert-manager, KubeVirt, CDI). Cilium options become
      typed ClusterConfig fields. A minor because CRD upgrades cannot be undone
      with bootc rollback.

  - version: v2.5.0
    kind: minor
    minFrom: v2.4.0
    kubernetes: "1.35.10"
    crio: "1.35"
    fedora: 45
    syncManifest: false
    notes: >-
      Base image moves from Fedora 43 to Fedora 45 (Fedora 43 reaches end of
      life on 2026-12-02). Kubernetes and CRI-O are unchanged. The host etcd
      package is gone: backups run etcdctl from the etcd image.

  - version: v2.6.0
    kind: minor
    minFrom: v2.5.0
    kubernetes: "1.35.10"
    crio: "1.35"
    fedora: 45
    syncManifest: true
    notes: >-
      Traefik replaces ingress-nginx, whose last release is tested only up to
      Kubernetes 1.35. Operator v0.4.2 uninstalls ingress-nginx, then installs
      Traefik on the same IP or host ports. k4all's own routes (Headlamp,
      Argo CD) move to the traefik class and spec.ingress.nginx moves to
      spec.ingress.traefik; Ingresses of class nginx keep working through
      Traefik's Ingress-NGINX provider until they move. Routes are down for
      a few seconds during the sync. A minor because it replaces a platform
      component.

  - version: v2.7.0
    kind: minor
    minFrom: v2.6.0
    kubernetes: "1.36.6"
    crio: "1.36"
    fedora: 45
    syncManifest: false
    notes: >-
      Kubernetes 1.35 to 1.36 (kubeadm upgrade before the reboot) and CRI-O
      1.36. Before kubeadm 1.36, k4all-upgrade removes the flex-volume flag
      from the kubeadm-config ConfigMap (kubeadm 1.36 no longer mounts the
      flex-volume directory into the controller manager). The components of
      v2.4.0 and Traefik already support 1.36. ingress-nginx, which v2.6.0
      removed from every cluster, leaves the release manifest.
