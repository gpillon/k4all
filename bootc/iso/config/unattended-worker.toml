# K4All bootc-image-builder config — Unattended Worker Node
# Builds an anaconda-iso that auto-installs a worker K4All node.
# Disk layout: 20% OS (rootvg) / remaining 80% for vg_data (K4All storage).
# Note: customizations.user CANNOT coexist with customizations.installer.kickstart

[customizations.iso]
volume_id = "K4all"
application_id = "K4all"
publisher = "gpillon"

[customizations.installer.kickstart]
contents = """
text --non-interactive

rootpw --lock
user --name=core --groups=wheel --password=core --plaintext
lang en_US.UTF-8
keyboard us
timezone UTC --utc

network --bootproto=dhcp --device=link --activate --onboot=on
services --enabled=sshd

# Dynamic 20/80 partitioning — calculated in %pre
%include /tmp/part-include

%addon com_k4all_installer --role=worker --cni=calico
{
  "networking": {
    "cni": { "type": "calico" },
    "firewalld": { "enabled": "false" },
    "iface": { "dev": "auto", "ipconfig": "dhcp" }
  },
  "storage": {
    "vg_data": { "enabled": "true", "disk": "auto" }
  }
}
%end

%pre --interpreter=/bin/bash
DISK=$(lsblk -ndo NAME,TYPE | awk '/disk/{print $1; exit}')
DISK_MB=$(lsblk -ndb -o SIZE /dev/$DISK | awk '{printf "%d", $1/1024/1024}')
BOOT_MB=1024
EFI_MB=600
RESERVED=$((BOOT_MB + EFI_MB))
USABLE=$((DISK_MB - RESERVED))
OS_MB=$((USABLE * 20 / 100))
[ "$OS_MB" -lt 30000 ] && OS_MB=30000
[ "$OS_MB" -gt 200000 ] && OS_MB=200000
SWAP_MB=4000
ROOT_MB=$((OS_MB - SWAP_MB))

cat > /tmp/part-include <<EOF
bootloader --location=mbr
clearpart --all --initlabel --disklabel=gpt
part /boot --fstype=xfs --size=${BOOT_MB}
part /boot/efi --fstype=efi --size=${EFI_MB}
part pv.01 --size=${OS_MB}
part pv.02 --size=1 --grow
volgroup rootvg pv.01
logvol / --vgname=rootvg --fstype=xfs --size=${ROOT_MB} --name=rootlv
logvol swap --vgname=rootvg --size=${SWAP_MB} --name=swaplv
EOF
%end

%post --nochroot
cp /etc/resolv.conf /mnt/sysimage/etc/resolv.conf
%end

%post
echo "core ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/core
%end

reboot --eject
"""
