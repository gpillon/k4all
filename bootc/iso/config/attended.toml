# K4All bootc-image-builder config — Attended (Interactive) Install
# Builds an anaconda-iso with full Anaconda GUI.
# The K4All addon spoke will be visible for interactive configuration.
# Storage is NOT preconfigured — the user configures storage via the Storage spoke
# or uses the K4All recommended layout button in the K4All spoke.
# IMPORTANT: No destructive disk operations in %pre — the disk is safe until
# the user explicitly configures storage and begins installation.

[customizations.iso]
volume_id = "K4all"
application_id = "K4all"
publisher = "gpillon"

[customizations.installer.kickstart]
contents = """
lang en_US.UTF-8
keyboard us
timezone UTC --utc
graphical

rootpw --lock
user --name=core --groups=wheel --password=core --plaintext

network --bootproto=dhcp --device=link --activate --onboot=on
services --enabled=sshd

reboot --eject

%addon com_k4all_installer --cni=calico --ha=none
%end

%post --nochroot
cp /etc/resolv.conf /mnt/sysimage/etc/resolv.conf
%end

%post
echo "core ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/core
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Localization",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Payloads",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Timezone",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Addons.*"
]
