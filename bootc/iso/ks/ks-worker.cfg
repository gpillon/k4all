# K4All Kickstart - Worker Node
# Standalone kickstart for manual use (e.g. PXE boot).
# For ISO builds, the config is embedded via bootc-image-builder config.toml.
#
# K4All layout: 80% OS (rootvg) / remaining for vg_data, no swap

lang en_US.UTF-8
keyboard us
timezone UTC --utc

rootpw --lock
user --name=core --groups=wheel --password=core --plaintext

network --bootproto=dhcp --device=link --activate --onboot=on
services --enabled=sshd

%include /tmp/part-include

# No CNI: the node joins the cluster's own (the bootstrap node chose it).
%addon com_k4all_installer --role=worker
{
  "networking": {
    "firewalld": { "enabled": false }
  },
  "componentOverrides": {}
}
%end

%pre --interpreter=/bin/bash --log=/tmp/k4all-storage-layout.log
set -euo pipefail
python3 /usr/share/anaconda/addons/com_k4all_installer/storage_layout.py \
  --output /tmp/part-include --os-percent 80
%end

%post --nochroot
cp /etc/resolv.conf /mnt/sysimage/etc/resolv.conf
%end

%post
echo "core ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/core
%end

reboot
