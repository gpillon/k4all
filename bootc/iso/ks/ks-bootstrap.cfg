# K4All Kickstart - Bootstrap Node
# This kickstart creates a bootstrap (first) node for the K4All cluster

# Language and keyboard
lang en_US.UTF-8
keyboard us
timezone UTC --utc

# Root password (change this!)
rootpw --plaintext k4all

# Create core user (standard K4All user)
user --name=core --groups=wheel --password=k4all --plaintext

# Network (DHCP by default, can be overridden)
network --bootproto=dhcp --device=link --activate --onboot=on

# Disk configuration
# Uses automatic partitioning with LVM
# We leave extra space for vg_data partition
bootloader --location=mbr
clearpart --all --initlabel
# Create partitions manually to reserve space for vg_data
part /boot --fstype=xfs --size=1024
part /boot/efi --fstype=efi --size=600
# pv.01: OS root volume group
part pv.01 --size=50000 --grow --maxsize=100000
# pv.02: remaining space for vg_data (K4All storage)
part pv.02 --size=1 --grow
volgroup rootvg pv.01
logvol / --vgname=rootvg --fstype=xfs --size=20000 --name=rootlv
logvol swap --vgname=rootvg --size=4000 --name=swaplv

# Enable services
services --enabled=sshd

# K4All Anaconda addon configuration
# vg_data will be created on pv.02 (remaining disk space)
%addon com_k4all_installer --role=bootstrap --cni=calico --ha=none
{
  "networking": {
    "cni": { "type": "calico" },
    "firewalld": { "enabled": "false" },
    "iface": { "dev": "auto", "ipconfig": "dhcp" }
  },
  "storage": {
    "vg_data": { "enabled": "true", "disk": "auto" }
  },
  "cluster": {
    "apiEndPointUseHostName": "false",
    "ha": { "type": "none" }
  },
  "features": {
    "virt": { "enabled": "false", "emulation": "auto" },
    "argocd": { "enabled": "false" }
  }
}
%end

# Post-install (addon already writes /etc/k4all-config.json and /etc/node-type)
%post
# Enable passwordless sudo for core user
echo "core ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/core
chown core:core /home/core/.kube 2>/dev/null || true
%end

# Reboot after installation
reboot

