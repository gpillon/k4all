apiVersion: v1
kind: Namespace
metadata:
  labels:
    kubernetes.io/metadata.name: openshift-console
  name: openshift-console
spec:
  finalizers:
    - kubernetes

---
apiVersion: v1
data:
  console-config.yaml: |
    apiVersion: console.openshift.io/v1
    kind: ConsoleConfig
    clusterInfo:
      consoleBaseAddress: http://localhost:9000
      controlPlaneTopology: SingleReplica
      releaseVersion: "custom"
    customization:
      branding: okd
      capabilities:
      - name: LightspeedButton
        visibility:
          state: Disabled
      - name: GettingStartedBanner
        visibility:
          state: Enabled
      developerCatalog:
        categories: null
        types:
          state: Enabled
      documentationBaseURL: https://github.com/gpillon/k4all/wiki/
      perspectives:
      - id: dev
        visibility:
          state: Disabled
kind: ConfigMap
metadata:
  name: console-config
  namespace: openshift-console

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: console
  namespace: openshift-console

---
apiVersion: v1
data:
  ca.crt: 
  namespace: b3BlbnNoaWZ0LWNvbnNvbGU=
  token: 
kind: Secret
metadata:
  labels:
    kubernetes.io/legacy-token-last-used: "2025-09-24"
  name: console-sa-token
  namespace: openshift-console
type: kubernetes.io/service-account-token

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: console
    namespace: openshift-console

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: console
    namespace: openshift-console
	
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: console
    component: ui
  name: console
  namespace: openshift-console
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: console
      component: ui
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: console
        component: ui
    spec:
      containers:
        - command:
            - /opt/bridge/bin/bridge
            - --public-dir=/opt/bridge/static
            - --user-auth=disabled
            - --config=/var/console-config/console-config.yaml
            - --k8s-mode-off-cluster-skip-verify-tls=true
          env:
            - name: BRIDGE_USER_AUTH
              value: disabled
            - name: BRIDGE_K8S_MODE
              value: off-cluster
            - name: BRIDGE_K8S_MODE_OFF_CLUSTER_ENDPOINT
              value: https://kubernetes.default.svc:443
            - name: BRIDGE_K8S_MODE_OFF_CLUSTER_SKIP_VERIFY_TLS
              value: "true"
            - name: BRIDGE_K8S_MODE_OFF_CLUSTER_CA_FILE
              value: /var/run/secrets/kubernetes.io/k8s-ca/ca.crt
            - name: BRIDGE_K8S_AUTH_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: console-sa-token
          image: quay.io/openshift/origin-console:4.21.0
          imagePullPolicy: Always
          name: console
          ports:
            - containerPort: 9000
              name: http
              protocol: TCP
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /var/console-config
              name: console-config
              readOnly: true
            - mountPath: /etc/pki/ca-trust/extracted/pem
              name: trusted-ca-bundle
              readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - configMap:
            defaultMode: 420
            name: console-config
          name: console-config
        - configMap:
            defaultMode: 420
            items:
              - key: ca.crt
                path: tls-ca-bundle.pem
            name: kube-root-ca.crt
          name: trusted-ca-bundle

---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: openshift-console
spec:
  clusterIP: 10.96.120.65
  clusterIPs:
    - 10.96.120.65
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: web
      port: 9000
      protocol: TCP
      targetPort: 9000
  selector:
    app: console
    component: ui
  sessionAffinity: None
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: console
  namespace: openshift-console
spec:
  ingressClassName: nginx
  rules:
    - host: console.192.168.221.161.nip.io
      http:
        paths:
          - backend:
              service:
                name: console
                port:
                  name: web
            path: /
            pathType: Prefix
