[Anaconda]
# bootc-image-builder's 90-osbuild.conf replaces Anaconda's default wildcard
# with a closed list of modules.  Repeat that list and add K4All explicitly so
# the boss starts the addon before its one-shot kickstart distribution and
# includes it when collecting installation tasks.
activatable_modules =
    org.fedoraproject.Anaconda.Modules.Network
    org.fedoraproject.Anaconda.Modules.Payloads
    org.fedoraproject.Anaconda.Modules.Runtime
    org.fedoraproject.Anaconda.Modules.Security
    org.fedoraproject.Anaconda.Modules.Services
    org.fedoraproject.Anaconda.Modules.Storage
    org.fedoraproject.Anaconda.Modules.Users
    org.fedoraproject.Anaconda.Addons.K4All
