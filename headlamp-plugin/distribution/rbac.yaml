# RBAC for users of the k4all Headlamp plugin who are not cluster-admin.
# (k4all's default Headlamp login, the headlamp-admin token, is cluster-admin
# and needs none of this.)
#
# k4all-viewer:   sees every plugin page, cannot change anything.
# k4all-editor:   also saves settings and overrides, sets the management
#                 policy, re-applies components, and moves Ingresses from the
#                 nginx class to traefik (patch on ingresses, and on services
#                 for backend-protocol HTTPS).
# k4all-upgrader: also starts, pauses, resumes, stops and retries cluster
#                 upgrades (ClusterUpgrade, k4all v2.4.0+). An upgrade reboots
#                 every node, so it is a role of its own.
# Bind them with a ClusterRoleBinding: the k4all resources are cluster-scoped.
#
# The k4all v2.7.0 settings pages also read, where present: the KubeVirt CR
# (gates, version), StorageClasses and CDI StorageProfiles (VM state),
# CephClusters (Rook), and what the kubevirt-manager removal kept. Two reads
# are left out on purpose, and the pages say "unknown" without them: the
# node k4all-operator runs on (list pods in k4all-operator-system, for the
# node-settings rollout order) and the disks of Hangar's node agent (list
# pods and get pods/proxy in hangar-system; Hangar's hangar-hardware-admin
# role has them), and the ConfigMap kube-system/kubelet-config (what a
# cleared kubelet field goes back to; the page then gives the rule). From
# k4all v2.7.2 the Upgrades page also lists pods in the headlamp namespace,
# where it can, to warn on the node this page runs on (it moves when that
# node drains); without it the page says so once. No read needs a Secret.
#
# The upgrade-readiness writes of k4all v2.7.2 (k4all-operator v0.7.0) need
# no new rule: Check again, pre-approve, Apply fix, Accept and Put back now
# patch the ClusterUpgrade k4all (k4all-upgrader); the remediation modes and
# the node-settings rollout's answers patch the ClusterConfig (k4all-editor).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k4all-viewer
  labels:
    app.kubernetes.io/part-of: k4all
rules:
  - apiGroups: [k4all.magesgate.com]
    resources: [clusterconfigs, releasemanifests, nodeconfigs, clusterupgrades]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  # "Ingresses still on the nginx class" (Settings > Ingress, Overview).
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]  # k4all v2.7.0 settings pages (virtualization, storage) and the
  # kubevirt-manager component page.
  - apiGroups: [kubevirt.io]
    resources: [kubevirts]
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list]
  - apiGroups: [cdi.kubevirt.io]
    resources: [storageprofiles]
    verbs: [get, list]
  - apiGroups: [ceph.rook.io]
    resources: [cephclusters]
    verbs: [get, list]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    resourceNames: [vm-standard, vm-preemptible]
    verbs: [get]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [images.kubevirt-manager.io]
    verbs: [get]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kubevirt-manager]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k4all-editor
  labels:
    app.kubernetes.io/part-of: k4all
rules:
  - apiGroups: [k4all.magesgate.com]
    resources: [clusterconfigs, releasemanifests, nodeconfigs, clusterupgrades]
    verbs: [get, list, watch]
  # Settings and component overrides (JSON Patch on spec), management policy
  # and the force-resync annotation. No create/delete/update: the plugin
  # never replaces or removes these objects.
  - apiGroups: [k4all.magesgate.com]
    resources: [clusterconfigs, releasemanifests]
    verbs: [patch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  # Switch to traefik: the Ingress (class, annotations) and, for
  # backend-protocol HTTPS, an annotation on its Services.
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, patch]  # k4all v2.7.0 settings pages (virtualization, storage) and the
  # kubevirt-manager component page.
  - apiGroups: [kubevirt.io]
    resources: [kubevirts]
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list]
  - apiGroups: [cdi.kubevirt.io]
    resources: [storageprofiles]
    verbs: [get, list]
  - apiGroups: [ceph.rook.io]
    resources: [cephclusters]
    verbs: [get, list]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    resourceNames: [vm-standard, vm-preemptible]
    verbs: [get]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [images.kubevirt-manager.io]
    verbs: [get]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kubevirt-manager]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k4all-upgrader
  labels:
    app.kubernetes.io/part-of: k4all
rules:
  - apiGroups: [k4all.magesgate.com]
    resources: [clusterupgrades, releasemanifests, nodeconfigs]
    verbs: [get, list, watch]
  # targetRelease, paused, drain, graphUrl (JSON Patch on spec) and the
  # retry annotation (merge patch), on the one ClusterUpgrade.
  - apiGroups: [k4all.magesgate.com]
    resources: [clusterupgrades]
    resourceNames: [k4all]
    verbs: [patch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
# Example bindings.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k4all-editor-ops
subjects:
  - kind: Group
    name: k4all-ops
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: k4all-editor
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k4all-upgrader-ops
subjects:
  - kind: Group
    name: k4all-ops
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: k4all-upgrader
  apiGroup: rbac.authorization.k8s.io
